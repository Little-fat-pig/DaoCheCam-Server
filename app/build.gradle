plugins {
    id 'com.android.application'
}

android {
    namespace 'com.duopost.daoche.server'
    compileSdk 34

    defaultConfig {
        applicationId "com.duopost.daoche.server"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
